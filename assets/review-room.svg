<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Review Room — feedback, with a little more clarity.</title>
  <desc id="desc">Concept artwork for a visual feedback platform, with a design canvas and floating comment cards.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="20" fill="#232820"/>
  <rect width="1200" height="460" rx="20" fill="url(#grid)"/>
  <circle cx="47" cy="43" r="5" fill="#d5ed88"/>
  <text x="63" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#d5ed88">LAUNCHED SAAS</text>
  <text x="42" y="153" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-3" fill="#f3f1e9">Review Room<tspan fill="#d5ed88">.</tspan></text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#c8cdbf">
    <text x="45" y="213">Feedback, with a</text>
    <text x="45" y="249">little more clarity.</text>
  </g>
  <path d="M46 295H441" stroke="#69715e" stroke-opacity=".6"/>
  <text x="46" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" fill="#c8cdbf">COMMENT / REFINE / MOVE FORWARD</text>
  <text x="46" y="414" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.6" fill="#a0a994">LIVE PRODUCT ↗</text>
  <rect x="551" y="58" width="595" height="341" rx="14" fill="#141a13" stroke="#546047"/>
  <path d="M552 101H1145" stroke="#46503e"/>
  <circle cx="575" cy="80" r="4" fill="#77836c"/><circle cx="591" cy="80" r="4" fill="#77836c"/><circle cx="607" cy="80" r="4" fill="#77836c"/>
  <text x="1121" y="84" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1" fill="#aeb8a3">DESIGN REVIEW / CONCEPT</text>
  <rect x="577" y="124" width="328" height="247" rx="7" fill="#eeeae0"/>
  <text x="599" y="155" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#5a6052">A LITTLE SPACE TO CREATE</text>
  <text x="598" y="201" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.4" fill="#272e23">Good ideas.</text>
  <text x="598" y="240" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.4" fill="#272e23">Better together.</text>
  <rect x="599" y="269" width="129" height="29" rx="14" fill="#d2e68b"/>
  <text x="617" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2a3421">Make some space ↗</text>
  <path d="M600 337H877" stroke="#c3c5b7"/>
  <circle cx="835" cy="216" r="15" fill="#e85c35" stroke="#fff" stroke-width="3"/>
  <text x="835" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  <path d="M850 216H939V187" fill="none" stroke="#d5ed88" stroke-dasharray="4 5"/>
  <rect x="925" y="134" width="194" height="76" rx="9" fill="#d5ed88"/>
  <text x="941" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#273222">01 / A SMALL SUGGESTION</text>
  <text x="941" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#39452e">A little more room here?</text>
  <rect x="925" y="235" width="194" height="102" rx="9" fill="#30392b" stroke="#56634a"/>
  <text x="941" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1" fill="#d7dfcc">NEXT REVISION</text>
  <path d="M942 277H1102" stroke="#56634a"/>
  <circle cx="947" cy="297" r="5" fill="#d5ed88"/>
  <text x="961" y="301" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#d7dfcc">Give the headline space</text>
  <text x="1145" y="427" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5" fill="#a0a994">LESS BACK-AND-FORTH. MORE PROGRESS.</text>
</svg>
